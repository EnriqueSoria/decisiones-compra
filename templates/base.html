<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }}{% if titulo != 'Mis compras' %} · Mis compras{% endif %}</title>
  <link rel="stylesheet" href="{{ base }}assets/style.css">
</head>
<body>
  <header class="site-header"><nav class="wrap" aria-label="Principal">
    <a class="brand" href="{{ base }}index.html">
      <svg aria-hidden="true" viewBox="0 0 32 32" width="32" height="32"><path d="M0 15A15 15 0 0 1 15 0v15Z" fill="#405c49"/><circle cx="24" cy="7.5" r="7.5" fill="#c4785f"/><path d="M0 17h15v15A15 15 0 0 1 0 17Z" fill="#cea86b"/><path d="M17 17h15v15H17z" fill="#405c49"/></svg>
      Mis compras
    </a>
    {% block nav %}{% endblock %}
  </nav></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  {% if reload_version %}
  <script>
    const version = {{ reload_version|tojson }};
    async function checkForChanges() {
      try {
        const response = await fetch("{{ base }}__reload");
        if (response.ok && (await response.text()) !== version) {
          window.location.reload();
          return;
        }
      } catch {
        // El servidor puede estar reiniciándose.
      }
      window.setTimeout(checkForChanges, 1000);
    }
    window.setTimeout(checkForChanges, 1000);
  </script>
  {% endif %}
</body>
</html>
